services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    restart: unless-stopped
    networks:
      - saleor-network
    stdin_open: true
    tty: true
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    volumes:
      - saleor-media:/app/media
    env_file:
      - .env

  dashboard:
    image: ghcr.io/saleor/saleor-dashboard:latest
    ports:
      - "8088:80"
    restart: unless-stopped
    networks:
      - saleor-network
    environment:
      - API_URL=http://157.137.233.119:8000/graphql/
      - API_URI=http://157.137.233.119:8000/graphql/
      - LOCALE_CODE=ES
      - APP_MOUNT_URI=/dashboard/

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A saleor --app=saleor.celeryconf:app worker --loglevel=info -B
    restart: unless-stopped
    networks:
      - saleor-network
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    volumes:
      - saleor-media:/app/media

  db:
    image: postgres:15-alpine
    ports:
      - "5433:5432"
    restart: unless-stopped
    networks:
      - saleor-network
    environment:
      - POSTGRES_USER=saleor
      - POSTGRES_PASSWORD=saleor
      - POSTGRES_DB=saleor
    volumes:
      - saleor-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saleor -d saleor"]
      interval: 5s
      timeout: 5s
      retries: 5

  cache:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    restart: unless-stopped
    networks:
      - saleor-network
    volumes:
      - saleor-cache:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: unless-stopped
    networks:
      - saleor-network

volumes:
  saleor-db:
    driver: local
  saleor-cache:
    driver: local
  saleor-media:
    driver: local

networks:
  saleor-network:
    driver: bridge
